name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  desktop-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run desktop unit tests and build JAR
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :desktop:test :desktop:jar 2>&1 | tee gradle-desktop.log
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > payload.json
          import json, os
          txt = open("gradle-desktop.log", encoding="utf-8", errors="replace").read()
          lines = txt.splitlines()
          body = "\n".join(lines[:200])
          if len(lines) > 200:
              body += "\n...\n" + "\n".join(lines[-80:])
          print(json.dumps({
              "name": "desktop-failure-log",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {"title": "Desktop Gradle failure", "summary": "Build log", "text": body[:60000]}
          }))
          PY
          gh api "repos/${{ github.repository }}/check-runs" --method POST --input payload.json

  android-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run Android unit tests and assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee gradle-android.log
      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > payload.json
          import json, os
          txt = open("gradle-android.log", encoding="utf-8", errors="replace").read()
          lines = txt.splitlines()
          body = "\n".join(lines[:200])
          if len(lines) > 200:
              body += "\n...\n" + "\n".join(lines[-80:])
          print(json.dumps({
              "name": "android-failure-log",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {"title": "Android Gradle failure", "summary": "Build log", "text": body[:60000]}
          }))
          PY
          gh api "repos/${{ github.repository }}/check-runs" --method POST --input payload.json
